<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaction Previews</title>
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#777; --line:#e2e2e2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --muted:#888; --line:#2a2a2a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:14px; font-weight:500; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin:0 0 24px; }
  a { display:flex; justify-content:space-between; padding:18px 0; border-top:1px solid var(--line); color:inherit; text-decoration:none; font-size:22px; }
  a:last-child { border-bottom:1px solid var(--line); }
  a span { color:var(--muted); transition:transform .2s; }
  a:hover span { transform:translateX(4px); color:var(--fg); }
</style>
</head>
