<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover Index</title>
<link rel="stylesheet" href="hover-index.css">
<style>body{margin:0;background:#121212}</style>
</head>
<body>
<div class="hi_wrap" data-anm-hover-index data-anm-range="2" data-anm-dim="14" data-anm-follow="9">
  <p class="hi_label">Selected work</p>
  <ol class="hi_list" data-anm-hi-list>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/01.jpg" data-alt="An orange staircase lit from above beside a glowing LEDVANCE sign">Ledvance Pavilion</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/02.jpg" data-alt="A woman in on-ear headphones waiting at a sunny crosswalk">Urbanite Street</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/03.jpg" data-alt="A pale brick gabled house at dusk with a large glass door">Brick House</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/04.jpg" data-alt="A runner stretching on a stone bench in low evening sun">City Run</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/05.jpg" data-alt="An athlete training at a machine with a results screen">Gameday</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/06.jpg" data-alt="Two hands reaching toward each other around the AIRA wordmark">Aira Identity</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/07.jpg" data-alt="A phone showing a hot water timer in a dark app">Aira App</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/08.jpg" data-alt="Two tablets showing the Aira heat pump website">Aira Web</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/09.jpg" data-alt="An Aira billboard with floating fabric in a tiled underpass">Aira Campaign</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/10.jpg" data-alt="White and black track spotlights against orange scaffolding">Track Light</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/11.jpg" data-alt="Red and navy headphones resting on a concrete ledge">Urbanite Still</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/12.jpg" data-alt="A young woman with headphones leaning on a graffiti wall by a bicycle">Urbanite Mural</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/13.jpg" data-alt="A white wall unit in raking light with leaf shadows">Home Unit</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/14.jpg" data-alt="A hand tapping a training machine screen to log in">Gameday Login</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/15.jpg" data-alt="A dark coffee machine with a milk jug, capsules and a latte">Qbo</button></li>
    <li class="hi_row"><button class="hi_name" type="button" data-anm-hi-item data-image="images/16.jpg" data-alt="Wet sport earphones wrapped around a bottle with a spray of water">Sport Series</button></li>
  </ol>
  <figure class="hi_card" data-anm-hi-card aria-hidden="true">
    <div class="hi_frame" data-anm-hi-frame></div>
  </figure>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
<script src="hover-index.js"></script>
</body>
</html>
