<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layered Image Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; }

    .layered-slider {
      color: #fff;
      -webkit-user-select: none;
      user-select: none;
      padding-bottom: 15em;
      position: relative;
      overflow: clip;
    }

    .layered-slider__container {
      width: 100%;
      position: relative;
    }

    .layered-slider__bg-collection {
      z-index: 0;
      position: absolute;
      inset: 0%;
      overflow: clip;
    }

    .layered-slider__bg-item {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0%;
    }

    .layered-slider__bg-img {
      object-fit: cover;
      -webkit-user-select: none;
      user-select: none;
      width: 100%;
      height: 100%;
      display: block;
    }

    .layered-slider__bg-dark {
      z-index: 2;
      background-color: #00000026;
      position: absolute;
      inset: 0%;
    }

    .layered-slider__text-collection {
      z-index: 3;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      display: flex;
      position: relative;
    }

    .layered-slider__text-list {
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      display: flex;
    }

    .layered-slider__text-item {
      text-align: center;
      cursor: pointer;
      max-width: 80%;
      position: absolute;
    }

    .layered-slider__text-title {
      letter-spacing: -.05em;
      color: inherit;
      font-family: Haffer XH, Inter, Arial, sans-serif;
      font-weight: 300;
      font-size: 4em;
      line-height: .8;
      text-decoration: none;
    }

    .layered-slider__mask-collection {
      z-index: 3;
      aspect-ratio: 4 / 5;
      border-radius: .75em;
      width: 20em;
      position: absolute;
      bottom: 0;
      left: 50%;
      overflow: hidden;
      transform: translate(-50%, 30%);
    }

    .layered-slider__mask-list {
      position: absolute;
      inset: 0%;
    }

    .layered-slider__mask-item {
      flex: none;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0%;
      overflow: hidden;
    }

    .layered-slider__mask-img {
      pointer-events: none;
      object-fit: cover;
      -webkit-user-select: none;
      user-select: none;
      width: 100%;
      height: 100%;
      display: block;
    }

    .layered-slider__overlay {
      z-index: 4;
      pointer-events: none;
      flex-flow: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 120em;
      margin-left: auto;
      margin-right: auto;
      padding: 2em;
      display: flex;
      position: absolute;
      top: 0;
      bottom: 0;
    }

    .layered-slider__overlay-top {
      grid-column-gap: .5em;
      grid-row-gap: .5em;
      pointer-events: auto;
      justify-content: center;
      align-items: center;
      display: flex;
    }

    .layered-slider__progress {
      background-color: #ffffff40;
      border-radius: 10em;
      width: 6em;
      height: 2px;
      overflow: hidden;
    }

    .layered-slider__progress-inner {
      transform-origin: 0%;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      background-color: #fff;
      transform: scale3d(0, 1, 1);
    }

    .layered-slider__overlay-btm {
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      display: flex;
    }

    .layered-slider__nav {
      grid-column-gap: .5em;
      grid-row-gap: .5em;
      pointer-events: auto;
      justify-content: center;
      align-items: center;
      display: flex;
    }

    .layered-slider__nav-button {
      background-color: #0000;
      border: 1px solid #ffffff4d;
      border-radius: 100em;
      justify-content: center;
      align-items: center;
      width: 3em;
      height: 3em;
      padding: .75em;
      display: flex;
      position: relative;
      font: inherit;
      color: #fff;
    }

    .layered-slider__nav-icon {
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      display: flex;
    }

    @media screen and (max-width: 767px) {
      .layered-slider__text-title {
        font-size: 2.5em;
      }

      .layered-slider__overlay {
        padding: 1em;
      }

      .layered-slider__overlay-btm {
        justify-content: center;
        align-items: center;
      }

      .layered-slider__nav {
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
    }

    @media screen and (max-width: 479px) {
      .layered-slider__mask-collection {
        width: 14em;
      }
    }
  </style>
</head>
<body>

<section data-layered-slider-init data-layered-slider-autoplay="5" class="layered-slider">
  <div class="layered-slider__container">
    <div class="layered-slider__bg-collection">
      <div class="layered-slider__bg-list">
        <div data-layered-slider-bg class="layered-slider__bg-item"><img src="slider-images/egym-title.jpg" alt="" class="layered-slider__bg-img"></div>
        <div data-layered-slider-bg class="layered-slider__bg-item"><img src="slider-images/ledvance-title.webp" alt="" class="layered-slider__bg-img"></div>
        <div data-layered-slider-bg class="layered-slider__bg-item"><img src="slider-images/qbo-title.jpg" alt="" class="layered-slider__bg-img"></div>
        <div data-layered-slider-bg class="layered-slider__bg-item"><img src="slider-images/urbanite-title.webp" alt="" class="layered-slider__bg-img"></div>
      </div>
    </div>
    <div class="layered-slider__bg-dark"></div>
    <div class="layered-slider__text-collection">
      <div class="layered-slider__text-list">
        <div data-layered-slider-title class="layered-slider__text-item">
          <a href="#" class="layered-slider__text-title">EGYM</a>
        </div>
        <div data-layered-slider-title class="layered-slider__text-item">
          <a href="#" class="layered-slider__text-title">Ledvance</a>
        </div>
        <div data-layered-slider-title class="layered-slider__text-item">
          <a href="#" class="layered-slider__text-title">Qbo</a>
        </div>
        <div data-layered-slider-title class="layered-slider__text-item">
          <a href="#" class="layered-slider__text-title">Urbanite</a>
        </div>
      </div>
    </div>
    <div data-layered-slider-mask class="layered-slider__mask-collection">
      <div class="layered-slider__mask-list">
        <div data-layered-slider-mask-item class="layered-slider__mask-item"><img src="slider-images/egym-small.jpg" alt="" draggable="false" class="layered-slider__mask-img"></div>
        <div data-layered-slider-mask-item class="layered-slider__mask-item"><img src="slider-images/ledvance-small.jpg" alt="" draggable="false" class="layered-slider__mask-img"></div>
        <div data-layered-slider-mask-item class="layered-slider__mask-item"><img src="slider-images/qbo-small.jpg" alt="" draggable="false" class="layered-slider__mask-img"></div>
        <div data-layered-slider-mask-item class="layered-slider__mask-item"><img src="slider-images/urbanite-small.webp" alt="" draggable="false" class="layered-slider__mask-img"></div>
      </div>
    </div>
    <div class="layered-slider__overlay">
      <div class="layered-slider__overlay-top">
        <span data-layered-slider-current class="layered-slider__span">01</span>
        <div class="layered-slider__progress">
          <div data-layered-slider-fill class="layered-slider__progress-inner"></div>
        </div>
        <span data-layered-slider-total class="layered-slider__span">04</span>
      </div>
      <div class="layered-slider__overlay-btm">
        <div class="layered-slider__nav">
          <button data-layered-slider-prev class="layered-slider__nav-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="100%" class="layered-slider__nav-icon">
              <path d="M15 6l-6 6 6 6"></path>
            </svg>
          </button>
          <button data-layered-slider-next class="layered-slider__nav-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="100%" class="layered-slider__nav-icon">
              <path d="M9 6l6 6-6 6"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/Observer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"></script>
<script>
gsap.registerPlugin(Observer, CustomEase);
CustomEase.create('osmo', 'M0,0 C0.625,0.05 0,1 1,1');

function initLayeredImageSlider() {
  document.querySelectorAll('[data-layered-slider-init]').forEach((root) => {
    if (root._layeredSlider) root._layeredSlider.destroy();

    const titles = [...root.querySelectorAll('[data-layered-slider-title]')];
    if (!titles.length) return;
    const count = titles.length;

    const backgrounds = [...root.querySelectorAll('[data-layered-slider-bg]')];
    const maskItems = [...root.querySelectorAll('[data-layered-slider-mask-item]')];
    const maskFrame = root.querySelector('[data-layered-slider-mask]');
    const fill = root.querySelector('[data-layered-slider-fill]');
    const currentEl = root.querySelector('[data-layered-slider-current]');
    const totalEl = root.querySelector('[data-layered-slider-total]');
    const prevBtn = root.querySelector('[data-layered-slider-prev]');
    const nextBtn = root.querySelector('[data-layered-slider-next]');

    // All elements that 'pause' the autoplay on hover
    const controls = [...new Set([...titles, ...root.querySelectorAll('a, button')])];

    // Autoplay, value is seconds between slides, 0 disables autoplay
    const autoplayAttr = root.getAttribute('data-layered-slider-autoplay');
    const autoplay = autoplayAttr !== null ? parseFloat(autoplayAttr) : 5;

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = gsap.utils.clamp;
    const wrap = (distance) => distance - count * Math.round(distance / count);

    const transitionDuration = 1;
    const backgroundZoom = 0;
    const titleGap = 0.5;
    const titleSpacing = 40;

    if (totalEl) totalEl.textContent = String(count).padStart(2, '0');

    let titleStep = 0;
    let maskStep = 0;
    const measure = () => {
      const widestTitle = Math.max(...titles.map((title) => title.offsetWidth));
      titleStep = Math.max(root.clientWidth * titleGap, widestTitle + titleSpacing);
      maskStep = maskFrame ? maskFrame.clientWidth : root.clientWidth;
    };
    measure();

    const state = { progress: 0 };
    let activeIndex = -1;

    // The active slide has [data-active] on its background, title, and mask
    const setActive = (previousIndex, index) => {
      [backgrounds, titles, maskItems].forEach((list) => {
        if (previousIndex >= 0 && list[previousIndex])
          list[previousIndex].removeAttribute('data-active');
        if (list[index]) list[index].setAttribute('data-active', '');
      });
    };

    const render = (progress) => {
      const centeredIndex = ((Math.round(progress) % count) + count) % count;

      for (let i = 0; i < count; i++) {
        // How far this slide sits from the centre: signed (left / right) and absolute.
        const offset = wrap(i - progress);
        const distance = Math.abs(offset);

        const background = backgrounds[i];
        if (background) {
          const backgroundOpacity = clamp(0, 1, 1 - distance);
          gsap.set(background, {
            opacity: backgroundOpacity,
            scale: 1 + backgroundZoom - backgroundZoom * backgroundOpacity,
            zIndex: Math.round(backgroundOpacity * 100),
          });
        }

        gsap.set(titles[i], {
          x: offset * titleStep,
          opacity: i === centeredIndex ? 1 : 0.4,
          pointerEvents: 'auto',
        });

        const maskItem = maskItems[i];
        if (maskItem) {
          gsap.set(maskItem, { x: offset * maskStep });
        }
      }

      // Sync the counter and [data-active] to whichever slide is now centred.
      if (centeredIndex !== activeIndex) {
        const previousIndex = activeIndex;
        activeIndex = centeredIndex;
        setActive(previousIndex, centeredIndex);
        if (currentEl) currentEl.textContent = String(centeredIndex + 1).padStart(2, '0');
      }
    };

    let hovering = 0;
    let autoTween = null;
    const startAutoplay = () => {
      if (!autoTween) return;
      autoTween.restart();
      if (hovering > 0) autoTween.pause();
    };

    let slideTween = null;
    let current = 0;
    function goTo(delta) {
      current += delta;
      if (slideTween) slideTween.kill();
      slideTween = gsap.to(state, {
        progress: current,
        duration: reduced ? 0 : transitionDuration,
        ease: 'osmo',
        onUpdate: () => render(state.progress),
      });
      startAutoplay();
    }

    // Step to a specific slide by index
    function goToIndex(i) {
      const delta = wrap(i - current);
      if (delta !== 0) goTo(delta);
    }

    // Autoplay fills the bar
    if (autoplay > 0 && !reduced && fill) {
      gsap.set(fill, { scaleX: 0, transformOrigin: 'left center' });
      autoTween = gsap.to(fill, {
        scaleX: 1,
        duration: autoplay,
        ease: 'none',
        paused: true,
        onComplete: () => goTo(1),
      });
    }

    // Support a horizontal swipe gesture to navigate
    let gestureUsed = false;
    const observer = Observer.create({
      target: root,
      type: 'touch,pointer',
      dragMinimum: 10,
      tolerance: 25,
      lockAxis: true,
      onDragStart() {
        gestureUsed = false;
      },
      onLeft() {
        if (!gestureUsed) {
          gestureUsed = true;
          goTo(1);
        }
      },
      onRight() {
        if (!gestureUsed) {
          gestureUsed = true;
          goTo(-1);
        }
      },
    });

    const onPrev = () => goTo(-1);
    const onNext = () => goTo(1);
    if (prevBtn) prevBtn.addEventListener('click', onPrev);
    if (nextBtn) nextBtn.addEventListener('click', onNext);

    // Click a title: the active one lets its link through, any other jumps to it.
    const onTitleClick = (e) => {
      const i = titles.indexOf(e.currentTarget);
      if (i === activeIndex) return;
      e.preventDefault();
      goToIndex(i);
    };
    titles.forEach((title) => title.addEventListener('click', onTitleClick));

    // Autoplay pauses only while an interactive control is hovered
    const onEnter = () => {
      hovering++;
      if (autoTween) autoTween.pause();
    };
    const onLeave = () => {
      hovering = Math.max(0, hovering - 1);
      if (autoTween && hovering === 0) autoTween.resume();
    };
    controls.forEach((el) => {
      el.addEventListener('pointerenter', onEnter);
      el.addEventListener('pointerleave', onLeave);
    });

    const onResize = () => {
      measure();
      render(state.progress);
    };
    window.addEventListener('resize', onResize);

    // Title widths change when the web font swaps in, so re-measure then too.
    if (document.fonts) document.fonts.ready.then(onResize);

    render(0);
    startAutoplay();

    root._layeredSlider = {
      goTo,
      destroy() {
        observer.kill();
        if (slideTween) slideTween.kill();
        if (autoTween) autoTween.kill();
        window.removeEventListener('resize', onResize);
        if (prevBtn) prevBtn.removeEventListener('click', onPrev);
        if (nextBtn) nextBtn.removeEventListener('click', onNext);
        titles.forEach((title) => title.removeEventListener('click', onTitleClick));
        controls.forEach((el) => {
          el.removeEventListener('pointerenter', onEnter);
          el.removeEventListener('pointerleave', onLeave);
        });
        root._layeredSlider = null;
      },
    };
  });
}

// Initialize Layered Image Slider
document.addEventListener('DOMContentLoaded', () => {
  initLayeredImageSlider();
});
</script>
</body>
</html>
